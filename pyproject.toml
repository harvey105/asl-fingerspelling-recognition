[project]
name = "asl-fingerspelling-recognition"
version = "0.1.0"
description = "Real-Time American Sign Language (ASL) Fingerspelling Recognition with PyTorch"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.9.0.80",
    "mediapipe>=0.10.14",
    "albumentations>=1.4.0",
    "pillow>=10.2.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "gradio>=4.20.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]